name: Publish portfolio
on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'Keep the public site in preparation until all content is ready'
        required: true
        default: maintenance
        type: choice
        options:
          - maintenance
          - portfolio
      publish:
        description: 'Type PUBLISH after reviewing content, social links, CV and imagery'
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    if: inputs.publish == 'PUBLISH'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build portfolio
        run: npm run build
      - uses: actions/configure-pages@v5
      - name: Stage website only
        env:
          SITE_MODE: ${{ inputs.mode }}
        run: |
          mkdir _site
          if [ "$SITE_MODE" = "portfolio" ]; then
            cp -R dist/. _site/
          else
            cp maintenance/index.html _site/index.html
          fi
          touch _site/.nojekyll
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
